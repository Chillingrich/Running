name: Parse FIT Files

on:
  push:
    paths:
      - 'fits/**.fit'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garmin-fit-sdk

      - name: Parse FIT files
        run: python parser.py

      - name: Commit sessions.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sessions.json
          git diff --staged --quiet || git commit -m "Auto-parse FIT files [skip ci]"
          git push
